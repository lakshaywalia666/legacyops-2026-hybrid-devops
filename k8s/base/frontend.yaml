apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacyops-frontend
  namespace: legacyops
  labels:
    app.kubernetes.io/name: legacyops-frontend
    app.kubernetes.io/part-of: legacyops-2026
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: legacyops-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legacyops-frontend
        app.kubernetes.io/part-of: legacyops-2026
    spec:
      containers:
        - name: frontend
          image: legacyops-frontend:compose
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: legacyops-frontend
  namespace: legacyops
  labels:
    app.kubernetes.io/name: legacyops-frontend
    app.kubernetes.io/part-of: legacyops-2026
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: legacyops-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
