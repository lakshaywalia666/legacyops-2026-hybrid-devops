services:
  postgres:
    image: postgres:16-alpine
    container_name: legacyops-postgres
    environment:
      POSTGRES_DB: legacyops
      POSTGRES_USER: legacyops
      POSTGRES_PASSWORD: legacyops
    ports:
      - "5432:5432"
    volumes:
      - legacyops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacyops -d legacyops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: legacyops-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./app/backend
    image: legacyops-backend:compose
    container_name: legacyops-backend
    environment:
      APP_NAME: Legacy Retail Operations System
      APP_ENV: docker
      APP_VERSION: 1.0.0
      DATABASE_URL: postgresql+psycopg2://legacyops:legacyops@postgres:5432/legacyops
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: "true"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./app/frontend
      args:
        VITE_API_URL: http://localhost:8000
    image: legacyops-frontend:compose
    container_name: legacyops-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  legacyops_postgres_data:
