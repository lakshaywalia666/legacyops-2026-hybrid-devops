name: LegacyOps CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  backend-validation:
    name: Backend validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend source
        run: python -m compileall app

      - name: Import FastAPI application
        env:
          APP_ENV: ci
          DATABASE_URL: postgresql+psycopg2://legacyops:legacyops@localhost:5432/legacyops
          REDIS_URL: redis://localhost:6379/0
          REDIS_REQUIRED: "false"
        run: |
          python -c "from app.main import app; print('Backend import OK:', app.title)"

  frontend-validation:
    name: Frontend validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

  docker-compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    needs:
      - backend-validation
      - frontend-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build Docker Compose images
        run: docker compose build

      - name: Start full stack
        run: docker compose up -d

      - name: Show running containers
        run: docker compose ps

      - name: Verify backend health endpoint
        run: |
          timeout 60 bash -c 'until curl -fsS http://localhost:8000/health; do sleep 2; done'

      - name: Verify frontend HTTP response
        run: curl -fsSI http://localhost:3000

      - name: Stop full stack
        if: always()
        run: docker compose down -v
