name: Publish Container Images

on:
  push:
    branches:
      - main
    paths:
      - "app/backend/**"
      - "app/frontend/**"
      - ".github/workflows/container-registry.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: lakshaywalia666/legacyops-2026-hybrid-devops

jobs:
  publish-images:
    name: Build and publish images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - name: backend
            context: app/backend
            image: legacyops-backend
          - name: frontend
            context: app/frontend
            image: legacyops-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=http://192.168.1.12:30081
